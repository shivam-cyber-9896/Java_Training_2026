<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Course Management System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#1e3c72,#2a5298);
}

.container{
    background:white;
    padding:40px;
    width:450px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

h1{
    color:#1e3c72;
    margin-bottom:15px;
    font-size:32px;
}

p{
    color:#555;
    margin-bottom:30px;
    font-size:18px;
}

a{
    display:inline-block;
    padding:12px 35px;
    background:#1e3c72;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-size:18px;
    transition:0.3s;
}

a:hover{
    background:#16325c;
    transform:scale(1.05);
}

</style>

</head>

<body>

<div class="container">

    <h1>
        Student Course Management System
    </h1>

    <p>
        Welcome to the Student Course Registration
        and Management Portal
    </p>

    <a href="login">
        Login
    </a>

</div>

</body>
</html>
